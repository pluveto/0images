<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="600" height="240" fill="#FAF9F5" rx="8"/>
  
  <!-- Left Box: Expression -->
  <rect x="40" y="50" width="160" height="140" rx="10" fill="#E3ECE9" stroke="#5B8276" stroke-width="1.5"/>
  <text x="120" y="85" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#2C433B" text-anchor="middle">Expression</text>
  <line x1="60" y1="100" x2="180" y2="100" stroke="#5B8276" stroke-width="1" stroke-opacity="0.5"/>
  <text x="120" y="130" font-family="DejaVu Sans, monospace" font-size="14" fill="#2C433B" text-anchor="middle">1 + 1</text>
  <text x="120" y="160" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Syntactic Form</text>

  <!-- Arrow: Reduction / Computation -->
  <path d="M 220 120 L 360 120" stroke="#7C8B82" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="105" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#444444" text-anchor="middle">Evaluation</text>
  <text x="290" y="140" font-family="DejaVu Sans, monospace" font-size="11" fill="#7C8B82" text-anchor="middle">#eval</text>

  <!-- Right Box: Value / Normal Form -->
  <rect x="380" y="50" width="160" height="140" rx="10" fill="#F3EAD8" stroke="#967540" stroke-width="1.5"/>
  <text x="460" y="85" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#4A391D" text-anchor="middle">Value</text>
  <line x1="400" y1="100" x2="520" y2="100" stroke="#967540" stroke-width="1" stroke-opacity="0.5"/>
  <text x="460" y="130" font-family="DejaVu Sans, monospace" font-size="14" fill="#4A391D" text-anchor="middle">2</text>
  <text x="460" y="160" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Normal Form</text>

  <!-- Defs for arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7C8B82"/>
    </marker>
  </defs>
</svg>