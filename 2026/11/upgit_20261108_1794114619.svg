    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:date>2026-11-08T13:08:47.407161</dc:date>
    <dc:description>import numpy as np
import matplotlib as mpl
import matplotlib.pyplot as plt
from matplotlib.patches import FancyArrowPatch, Arc, PathPatch
from matplotlib.path import Path

mpl.rcParams.update({
    "font.family": "DejaVu Sans",
    "mathtext.fontset": "dejavusans",
    "font.size": 13,
    "text.color": "#263238",
    "figure.facecolor": "white",
    "axes.facecolor": "white",
    "svg.fonttype": "path",
})

fig = plt.figure(figsize=(5.2, 3.8))
ax = fig.add_axes([0.055, 0.07, 0.91, 0.88])
ax.set_aspect("equal")
ax.set_xlim(-0.25, 3.65)
ax.set_ylim(-0.95, 2.25)
ax.axis("off")

blue = "#2b6cb0"
green = "#2f855a"
slate = "#657786"
ink = "#263238"

origin = np.array([0.0, 0.0])
e1 = np.array([1.0, 0.0])
v = np.array([2.5, 1.8])
foot = np.array([2.5, 0.0])
theta = np.arctan2(v[1], v[0])

# Light reference line and highlighted scalar projection.
ax.plot([0, 3.5], [0, 0], color=slate, alpha=0.35,
        linewidth=1.2, solid_capstyle="round", zorder=1)
ax.plot([0, foot[0]], [0, 0], color=blue, alpha=0.40,
        linewidth=3.0, solid_capstyle="butt", zorder=2)

# Orthogonal drop and right-angle marker.
ax.plot([v[0], foot[0]], [v[1], foot[1]], color=slate,
        linewidth=1.35, linestyle=(0, (4, 3)), zorder=2)
square = 0.15
ax.plot([foot[0] - square, foot[0] - square, foot[0]],
        [0, square, square], color=slate, linewidth=1.15, zorder=3)

# Both vectors retain their specified endpoints.
for endpoint, color in [(e1, blue), (v, green)]:
    ax.add_patch(FancyArrowPatch(
        origin, endpoint, arrowstyle="-|&gt;", mutation_scale=16,
        linewidth=2.8, color=color, shrinkA=0, shrinkB=0,
        capstyle="round", joinstyle="round", zorder=5
    ))

ax.add_patch(Arc(
    origin, 0.88, 0.88, theta1=0, theta2=np.degrees(theta),
    color=ink, linewidth=1.15, zorder=4
))
ax.text(0.63 * np.cos(theta / 2), 0.63 * np.sin(theta / 2),
        r"$\theta$", ha="center", va="center", fontsize=14)

ax.text(-0.075, -0.10, r"$O$", ha="right", va="top")
ax.text(1.03, 0.105, r"$\vec{e}_1$", color=blue,
        ha="center", va="bottom", fontsize=15)
ax.text(2.53, 1.86, r"$\vec{v}$", color=green,
        ha="left", va="bottom", fontsize=16)

# Smooth downward brace spanning precisely the projection interval.
x0, x1 = origin[0], foot[0]
mid = (x0 + x1) / 2
y, depth = -0.28, 0.18
vertices = [
    (x0, y),
    (x0, y - depth), (mid - 0.20, y), (mid, y - depth),
    (mid + 0.20, y), (x1, y - depth), (x1, y),
]
codes = [Path.MOVETO] + [Path.CURVE4] * 6
ax.add_patch(PathPatch(
    Path(vertices, codes), fill=False, edgecolor=slate,
    linewidth=1.25, capstyle="round", joinstyle="round"
))
ax.text(mid, -0.62,
        r"$\vec{e}_1 \cdot \vec{v} = \|\vec{v}\|\cos\theta$",
        ha="center", va="center", fontsize=15)</dc:description>
