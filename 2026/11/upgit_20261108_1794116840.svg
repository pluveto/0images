<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="374.4pt" height="273.6pt" viewBox="0 0 374.4 273.6" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:date>2026-11-08T13:46:50.030138</dc:date>
    <dc:description>import numpy as np
import matplotlib as mpl
import matplotlib.pyplot as plt
from matplotlib.patches import FancyArrowPatch

mpl.rcParams.update({
    "font.family": "DejaVu Sans",
    "mathtext.fontset": "dejavusans",
    "font.size": 12,
    "figure.facecolor": "white",
    "axes.facecolor": "white",
    "text.color": "#263238",
    "svg.fonttype": "path",
})

INK = "#263238"
SLATE = "#657786"
BLUE = "#33658A"
TEAL = "#2A9D8F"
TERRACOTTA = "#C66B4E"

fig = plt.figure(figsize=(5.2, 3.8))
ax = fig.add_axes([0.065, 0.075, 0.91, 0.89])
ax.set_xlim(-0.30, 5.05)
ax.set_ylim(-0.30, 4.45)
ax.set_aspect("equal", adjustable="box")
ax.axis("off")

# Dimensionless schematic coordinates; the trajectory is exactly prescribed.
def trajectory(x):
    return 4.0 - 0.35 * x**2

origin = np.array([0.0, 0.0])
x1, x2 = 1.05, 2.65
p1 = np.array([x1, trajectory(x1)])
p2 = np.array([x2, trajectory(x2)])
tangent = np.array([1.0, -0.70 * x1])

def arrow(start, end, color, linewidth=1.8, scale=12, **kwargs):
    patch = FancyArrowPatch(
        start, end,
        arrowstyle="-|&gt;",
        mutation_scale=scale,
        linewidth=linewidth,
        color=color,
        shrinkA=0,
        shrinkB=0,
        capstyle="round",
        joinstyle="round",
        **kwargs
    )
    ax.add_patch(patch)
    return patch

# Light coordinate axes, without ticks or a surrounding frame.
arrow(origin, (4.52, 0), SLATE, linewidth=0.9, scale=9, alpha=0.65, zorder=0)
arrow(origin, (0, 4.22), SLATE, linewidth=0.9, scale=9, alpha=0.65, zorder=0)
ax.text(-0.12, -0.13, r"$O$", ha="right", va="top", fontsize=12)
ax.text(4.64, -0.01, r"$x$", color=SLATE, ha="left", va="center")
ax.text(-0.02, 4.32, r"$y$", color=SLATE, ha="center", va="bottom")

# Smooth trajectory.
x = np.linspace(0.20, 3.28, 400)
ax.plot(x, trajectory(x), color=INK, linewidth=1.9, solid_capstyle="round", zorder=2)

# Position vectors at the two times.
arrow(origin, p1, BLUE, linewidth=1.8, zorder=3)
arrow(
    origin, p2, BLUE, linewidth=1.6,
    linestyle=(0, (4.5, 3.2)), alpha=0.65, zorder=3
)

# Secant displacement and instantaneous tangent velocity.
arrow(p1, p2, TEAL, linewidth=2.1, scale=13, zorder=5)
velocity_end = p1 + 1.50 * tangent
arrow(p1, velocity_end, TERRACOTTA, linewidth=2.7, scale=14, zorder=6)

ax.scatter(
    [p1[0], p2[0]], [p1[1], p2[1]],
    s=23, facecolor=INK, edgecolor="white", linewidth=0.65, zorder=7
)

# Labels follow their vectors, with ample clearance from neighboring elements.
ax.text(
    0.34, 1.94, r"$\mathbf{r}(t)$",
    color=BLUE, rotation=np.degrees(np.arctan2(p1[1], p1[0])),
    ha="center", va="center", rotation_mode="anchor"
)
ax.text(
    1.61, 0.63, r"$\mathbf{r}(t+\Delta t)$",
    color=BLUE, rotation=np.degrees(np.arctan2(p2[1], p2[0])),
    ha="center", va="center", rotation_mode="anchor"
)
delta = p2 - p1
ax.text(
    2.05, 2.06, r"$\Delta\mathbf{r}$",
    color=TEAL, rotation=np.degrees(np.arctan2(delta[1], delta[0])),
    ha="center", va="center", rotation_mode="anchor"
)
ax.text(
    2.02, 3.45, r"$\mathbf{v}(t)=\dot{\mathbf{r}}(t)$",
    color=TERRACOTTA, ha="left", va="center", fontsize=12
)</dc:description>
