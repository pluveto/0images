    <dc:description>import numpy as np
import matplotlib as mpl
import matplotlib.pyplot as plt
from matplotlib.patches import FancyArrowPatch

mpl.rcParams.update({
    "text.usetex": False,
    "font.family": "DejaVu Sans",
    "mathtext.fontset": "dejavusans",
    "font.size": 12,
    "figure.facecolor": "white",
    "axes.facecolor": "white",
    "text.color": "#263238",
    "svg.fonttype": "path",
})

ink = "#263238"
blue = "#33658A"
teal = "#2A9D8F"
slate = "#657786"

e1 = np.array([1.0, 0.0])
e2 = np.array([0.0, 1.0])
v = 3 * e1 + 2 * e2

fig = plt.figure(figsize=(6, 4.8), dpi=100)
ax = fig.add_axes([0.08, 0.10, 0.86, 0.80])
ax.set_aspect("equal")
ax.set_xlim(-0.55, 3.85)
ax.set_ylim(-0.48, 2.95)
ax.axis("off")

def arrow(start, end, color, linewidth, head, zorder):
    patch = FancyArrowPatch(
        start, end,
        arrowstyle="-|&gt;",
        mutation_scale=head,
        linewidth=linewidth,
        color=color,
        shrinkA=0,
        shrinkB=0,
        capstyle="round",
        joinstyle="round",
        zorder=zorder,
    )
    ax.add_patch(patch)

# Cartesian coordinate frame; coordinates are dimensionless.
arrow((-0.14, 0), (3.58, 0), ink, 1.2, 12, 1)
arrow((0, -0.14), (0, 2.65), ink, 1.2, 12, 1)

# Orthogonal projections of v = (3, 2).
ax.plot([v[0], v[0]], [0, v[1]], color=slate,
        linewidth=1.2, linestyle=(0, (4, 4)), zorder=0)
ax.plot([0, v[0]], [v[1], v[1]], color=slate,
        linewidth=1.2, linestyle=(0, (4, 4)), zorder=0)

# Unit basis vectors and the decomposed vector.
arrow((0, 0), e1, teal, 2.8, 16, 3)
arrow((0, 0), e2, teal, 2.8, 16, 3)
arrow((0, 0), v, blue, 2.5, 18, 4)

# Coordinate marks.
for x in (1, 3):
    ax.plot([x, x], [-0.045, 0.045], color=ink, linewidth=1.0, zorder=2)
for y in (1, 2):
    ax.plot([-0.045, 0.045], [y, y], color=ink, linewidth=1.0, zorder=2)

ax.text(-0.09, -0.12, "0", ha="right", va="top", fontsize=11)
ax.text(1, -0.12, "1", ha="center", va="top", fontsize=11)
ax.text(-0.12, 1, "1", ha="right", va="center", fontsize=11)
ax.text(3, -0.14, r"$v_1 = 3$", ha="center", va="top", fontsize=13)
ax.text(-0.14, 2, r"$v_2 = 2$", ha="right", va="center", fontsize=13)

ax.text(3.68, 0, r"$x$", ha="left", va="center", fontsize=14)
ax.text(0, 2.76, r"$y$", ha="center", va="bottom", fontsize=14)
ax.text(0.62, 0.13, r"$\mathbf{e}_1$", color=teal,
        ha="center", va="bottom", fontsize=15)
ax.text(0.12, 0.69, r"$\mathbf{e}_2$", color=teal,
        ha="left", va="center", fontsize=15)
ax.text(1.60, 1.24, r"$\mathbf{v}$", color=blue,
        ha="center", va="bottom", fontsize=17)

fig.text(
    0.52, 0.94,
    r"$\mathbf{v} = 3\mathbf{e}_1 + 2\mathbf{e}_2$",
    ha="center", va="center", fontsize=18, color=ink,
)</dc:description>
