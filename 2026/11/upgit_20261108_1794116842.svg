<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="374.4pt" height="273.6pt" viewBox="0 0 374.4 273.6" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:date>2026-11-08T13:47:04.742093</dc:date>
    <dc:description>import numpy as np
import matplotlib as mpl
import matplotlib.pyplot as plt
from matplotlib.patches import FancyArrowPatch, Arc

mpl.rcParams.update({
    "font.family": "DejaVu Sans",
    "mathtext.fontset": "dejavusans",
    "font.size": 13,
    "figure.facecolor": "white",
    "axes.facecolor": "white",
    "text.color": "#263238",
    "svg.fonttype": "path",
})

blue = "#33658A"
teal = "#2A9D8F"
terracotta = "#C66B4E"
slate = "#657786"
ink = "#263238"

r = 2.6
theta = np.deg2rad(35.0)
er = np.array([np.cos(theta), np.sin(theta)])
etheta = np.array([-np.sin(theta), np.cos(theta)])
O = np.zeros(2)
P = r * er

fig = plt.figure(figsize=(5.2, 3.8), facecolor="white")
ax = fig.add_axes([0.065, 0.065, 0.90, 0.89])
ax.set_aspect("equal", adjustable="box")
ax.set_xlim(-0.34, 3.55)
ax.set_ylim(-0.28, 2.75)
ax.axis("off")

def arrow(start, end, color, linewidth=1.8, head=12, zorder=3):
    patch = FancyArrowPatch(
        start, end,
        arrowstyle="-|&gt;",
        mutation_scale=head,
        linewidth=linewidth,
        edgecolor=color,
        facecolor=color,
        shrinkA=0,
        shrinkB=0,
        zorder=zorder,
    )
    ax.add_patch(patch)
    return patch

# Fixed coordinate axes, with actual unit-length Cartesian basis vectors.
ax.plot([0, 3.38], [0, 0], color=slate, lw=0.85, alpha=0.48, zorder=0)
ax.plot([0, 0], [0, 2.59], color=slate, lw=0.85, alpha=0.48, zorder=0)
arrow(O, (1, 0), slate, linewidth=1.6, head=11)
arrow(O, (0, 1), slate, linewidth=1.6, head=11)

# Constant-radius circle segment, centered at the origin and passing through P.
phi = np.deg2rad(np.linspace(5, 76, 300))
ax.plot(
    r * np.cos(phi), r * np.sin(phi),
    color=slate, alpha=0.43, lw=1.15,
    linestyle=(0, (4, 4)), zorder=1,
)

# Position vector and positive polar angle.
arrow(O, P, blue, linewidth=2.1, head=13)
ax.add_patch(Arc(
    O, 1.18, 1.18, theta1=0, theta2=35,
    linewidth=1.25, color=blue, zorder=2,
))
angle_label = 0.80 * np.array([np.cos(theta / 2), np.sin(theta / 2)])
ax.text(*angle_label, r"$\theta$", color=blue, ha="center", va="center")

# The rotating orthonormal basis: both vectors have length one.
arrow(P, P + er, terracotta, linewidth=2.0, head=12)
arrow(P, P + etheta, teal, linewidth=2.0, head=12)

# Small right-angle marker in the sector between the basis vectors.
s = 0.17
square = np.array([P + s * er, P + s * (er + etheta), P + s * etheta])
ax.plot(square[:, 0], square[:, 1], color=slate, lw=1.0, zorder=4)
ax.plot(*P, marker="o", ms=4.2, color=blue, zorder=5)

# Minimal mathematical labels.
ax.text(-0.075, -0.095, r"$O$", ha="right", va="top", color=ink)
ax.text(0.88, -0.105, r"$\mathbf{e}_1$", color=slate, ha="center", va="top")
ax.text(-0.115, 0.88, r"$\mathbf{e}_2$", color=slate, ha="right", va="center")

r_label = 0.51 * P - 0.16 * etheta
ax.text(*r_label, r"$r$", color=blue, ha="center", va="center")
ax.text(*(P + np.array([0.10, -0.13])), r"$P$", ha="left", va="top")

ax.text(
    *(P + 1.05 * er + np.array([0.02, 0.04])),
    r"$\mathbf{e}_r(\theta)$",
    color=terracotta, ha="left", va="bottom",
)
ax.text(
    *(P + etheta + np.array([-0.05, 0.11])),
    r"$\mathbf{e}_\theta(\theta)$",
    color=teal, ha="center", va="bottom",
)</dc:description>
