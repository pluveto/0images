<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="374.4pt" height="302.4pt" viewBox="0 0 374.4 302.4" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:date>2026-11-08T13:28:23.498562</dc:date>
    <dc:description>import numpy as np
import matplotlib as mpl
import matplotlib.pyplot as plt
from matplotlib.patches import Polygon, FancyArrowPatch

mpl.rcParams.update({
    "font.family": "DejaVu Sans",
    "mathtext.fontset": "dejavusans",
    "font.size": 13,
    "text.color": "#263238",
    "figure.facecolor": "white",
    "axes.facecolor": "white",
    "svg.fonttype": "path",
})

BLUE = "#33658A"
TEAL = "#2A9D8F"
OCHRE = "#D4A72C"
TERRACOTTA = "#C66B4E"
INK = "#263238"

# Illustrative mathematical vectors, not measured data.
# The cross product is computed exactly from the displayed construction.
a = np.array([2.0, 0.0, 0.0])
b = np.array([0.35, 1.8, 0.0])
c = np.cross(a, b)
origin = np.zeros(3)

# A right-handed orthographic view: a points right-forward, b right-backward,
# and their positive cross product points vertically upward on the page.
view_normal = np.array([6.0, -8.0, 8.0])
view_normal /= np.linalg.norm(view_normal)
screen_right = np.array([0.8, 0.6, 0.0])
screen_up = np.cross(view_normal, screen_right)
projection = np.vstack([screen_right, screen_up])

def project(points):
    return np.asarray(points) @ projection.T

fig = plt.figure(figsize=(5.2, 4.2), facecolor="white")
ax = fig.add_axes([0.035, 0.035, 0.93, 0.93])
ax.set_aspect("equal")
ax.set_xlim(-0.55, 3.50)
ax.set_ylim(-1.12, 3.05)
ax.set_axis_off()

# The planar region is precisely the parallelogram spanned by a and b.
corners = project(np.array([origin, a, a + b, b]))
ax.add_patch(Polygon(
    corners, closed=True, facecolor=OCHRE, edgecolor="none",
    alpha=0.18, zorder=1
))

# Only the two translated sides need auxiliary outlines.
for p, q in ((a, a + b), (b, a + b)):
    xy = project(np.array([p, q]))
    ax.plot(
        xy[:, 0], xy[:, 1],
        color=OCHRE, alpha=0.78, linewidth=1.25,
        linestyle=(0, (4, 3)), solid_capstyle="round", zorder=2
    )

# Both right-angle markers are constructed in their actual 3D planes.
z_unit = c / np.linalg.norm(c)
for vector, size in ((a, 0.18), (b, 0.23)):
    unit = vector / np.linalg.norm(vector)
    marker = project(np.array([
        size * unit,
        size * unit + size * z_unit,
        size * z_unit
    ]))
    ax.plot(
        marker[:, 0], marker[:, 1],
        color=INK, alpha=0.55, linewidth=1.0, zorder=3
    )

# The angle is the true angle in the horizontal plane, then projected.
theta = np.arctan2(b[1], b[0])
t = np.linspace(0.0, theta, 100)
radius = 0.52
arc = project(np.column_stack([
    radius * np.cos(t),
    radius * np.sin(t),
    np.zeros_like(t)
]))
ax.plot(
    arc[:, 0], arc[:, 1], color=INK,
    linewidth=1.2, alpha=0.85, zorder=4
)

theta_position = project(np.array([
    0.73 * np.cos(theta / 2),
    0.73 * np.sin(theta / 2),
    0.0
]))
ax.text(
    theta_position[0], theta_position[1] - 0.025,
    r"$\theta$", ha="center", va="center", fontsize=14, zorder=6
)

def vector_arrow(vector, color):
    start, end = project(np.array([origin, vector]))
    ax.add_patch(FancyArrowPatch(
        start, end,
        arrowstyle="-|&gt;", mutation_scale=18,
        linewidth=3.0, color=color,
        shrinkA=0, shrinkB=0,
        capstyle="round", joinstyle="round", zorder=5
    ))
    return end

pa = vector_arrow(a, BLUE)
pb = vector_arrow(b, TEAL)
pc = vector_arrow(c, TERRACOTTA)

ax.annotate(
    r"$O$", project(origin), xytext=(-10, -12),
    textcoords="offset points", ha="right", va="top", fontsize=14
)
ax.annotate(
    r"$\vec{a}$", pa, xytext=(4, -10),
    textcoords="offset points", ha="left", va="top",
    color=BLUE, fontsize=17
)
ax.annotate(
    r"$\vec{b}$", pb, xytext=(4, 7),
    textcoords="offset points", ha="left", va="bottom",
    color=TEAL, fontsize=17
)
ax.annotate(
    r"$\vec{a}\times\vec{b}$", pc, xytext=(12, -3),
    textcoords="offset points", ha="left", va="center",
    color=TERRACOTTA, fontsize=17
)

ax.text(
    1.85, 0.045,
    r"$\|\vec{a}\|\,\|\vec{b}\|\,\sin\theta$",
    ha="center", va="center", fontsize=13.5, color=INK, zorder=6
)</dc:description>
