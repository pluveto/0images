    <dc:date>2026-11-08T13:28:10.705076</dc:date>
    <dc:description>import numpy as np
import matplotlib as mpl
import matplotlib.pyplot as plt
from matplotlib.patches import FancyArrowPatch

mpl.rcParams.update({
    "font.family": "DejaVu Sans",
    "mathtext.fontset": "dejavusans",
    "font.size": 12,
    "text.color": "#263238",
    "figure.facecolor": "white",
    "axes.facecolor": "white",
    "svg.fonttype": "path",
})

# Given dimensionless vectors; the third coordinate embeds the diagram in 3D.
a_hat = np.array([1.0, 0.0, 0.0])
b = np.array([2.6, 2.0, 0.0])
a_cross = np.array([
    [0.0, -a_hat[2], a_hat[1]],
    [a_hat[2], 0.0, -a_hat[0]],
    [-a_hat[1], a_hat[0], 0.0],
])
b_parallel = np.outer(a_hat, a_hat) @ b
b_perp = -(a_cross @ a_cross) @ b
assert np.allclose(b, b_parallel + b_perp)

blue = "#33658A"
teal = "#2A9D8F"
green = "#6B8E5E"
terracotta = "#C66B4E"
ink = "#263238"
slate = "#657786"

fig = plt.figure(figsize=(5.4, 4.0), facecolor="white")
ax = fig.add_axes([0.035, 0.055, 0.94, 0.89])
ax.set_xlim(-0.5, 6.5)
ax.set_ylim(-2.45, 2.45)
ax.set_aspect("equal", adjustable="box")
ax.axis("off")

def arrow(start, end, color, width=2.4, scale=14, linestyle="-", zorder=3):
    patch = FancyArrowPatch(
        start, end,
        arrowstyle="-|&gt;",
        mutation_scale=scale,
        linewidth=width,
        linestyle=linestyle,
        color=color,
        shrinkA=0,
        shrinkB=0,
        capstyle="round",
        joinstyle="round",
        zorder=zorder,
    )
    ax.add_patch(patch)
    return patch

# Reference axis, with no extra frame or numeric coordinate axes.
ax.plot(
    [0.0, 3.5], [0.0, 0.0],
    color=slate, alpha=0.4, linewidth=1.1,
    linestyle=(0, (4, 4)), zorder=0,
)

# The unit vector lies on the same ray as the parallel projection.
arrow((0, 0), tuple(b_parallel[:2]), teal, width=2.6, scale=15)
arrow((0, 0), (1.2, 0), blue, width=2.7, scale=15, zorder=5)
arrow(tuple(b_parallel[:2]), tuple(b[:2]), green, width=2.6, scale=15)
arrow(
    tuple(b_parallel[:2]),
    tuple((b_parallel - b_perp)[:2]),
    terracotta, width=2.3, scale=15,
    linestyle=(0, (4, 3)),
)
arrow((0, 0), tuple(b[:2]), ink, width=2.9, scale=16, zorder=6)

# Right-angle marker on the interior of the decomposition triangle.
s = 0.18
ax.plot(
    [2.6 - s, 2.6 - s, 2.6],
    [0.0, s, s],
    color=slate, linewidth=1.0, zorder=4,
)

ax.text(-0.12, -0.14, r"$O$", ha="right", va="top", fontsize=13)
ax.text(
    0.88, 0.16, r"$\hat{\mathbf{a}}$",
    color=blue, ha="center", va="bottom", fontsize=15,
)
ax.text(
    1.18, 1.18, r"$\mathbf{b}$",
    color=ink, ha="center", va="bottom", fontsize=16,
)
ax.text(
    2.30, -0.29,
    r"$\mathbf{b}_{\parallel}"
    r"=(\hat{\mathbf{a}}\hat{\mathbf{a}}^\top)\mathbf{b}$",
    color=teal, ha="right", va="top", fontsize=11.5,
)
ax.text(
    2.85, 1.08, r"$\mathbf{b}_{\perp}$",
    color=green, ha="left", va="center", fontsize=14,
)
ax.text(
    2.85, -1.12,
    r"$[\hat{\mathbf{a}}]_{\times}^{2}\mathbf{b}"
    r"=-\mathbf{b}_{\perp}$",
    color=terracotta, ha="left", va="center", fontsize=12.5,
)</dc:description>
