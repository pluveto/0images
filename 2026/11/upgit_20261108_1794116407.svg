<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="360pt" height="288pt" viewBox="0 0 360 288" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:date>2026-11-08T13:37:50.973072</dc:date>
    <dc:description>import numpy as np
import matplotlib as mpl
import matplotlib.pyplot as plt
from matplotlib.patches import FancyArrowPatch

mpl.rcParams.update({
    "font.family": "DejaVu Sans",
    "mathtext.fontset": "dejavusans",
    "font.size": 12,
    "text.color": "#263238",
    "figure.facecolor": "white",
    "axes.facecolor": "white",
    "svg.fonttype": "path",
})

BLUE = "#33658A"
TEAL = "#2A9D8F"
TERRACOTTA = "#C66B4E"
SLATE = "#657786"
INK = "#263238"

fig = plt.figure(figsize=(5, 4), facecolor="white")
ax = fig.add_axes([0.055, 0.045, 0.89, 0.91])
ax.set_aspect("equal")
ax.axis("off")

# Exact orthographic projection of an illustrative 3D construction.
# The circular orbit lies in z = h, perpendicular to the unit axis u.
elevation = np.deg2rad(25)
screen_right = np.array([1.0, 0.0, 0.0])
screen_up = np.array([0.0, -np.sin(elevation), np.cos(elevation)])

def project(points):
    points = np.asarray(points)
    return np.stack(
        (points @ screen_right, points @ screen_up), axis=-1
    )

u = np.array([0.0, 0.0, 1.0])
origin = project(np.zeros(3))
radius, h = 0.65, 0.68
phi = np.deg2rad(28)
theta = np.deg2rad(116)

def orbit(t):
    t = np.asarray(t)
    return project(np.stack([
        radius * np.cos(t),
        radius * np.sin(t),
        np.full_like(t, h),
    ], axis=-1))

v = np.array([radius * np.cos(phi), radius * np.sin(phi), h])
R = np.array([
    [np.cos(theta), -np.sin(theta), 0.0],
    [np.sin(theta),  np.cos(theta), 0.0],
    [0.0, 0.0, 1.0],
])
Rv = R @ v

assert np.allclose(R @ u, u)
assert np.allclose(project(Rv), orbit(phi + theta))

# Axis continuation remains visually subordinate to its unit eigenvector.
axis_top = project(1.25 * u)
ax.plot(
    [origin[0], axis_top[0]], [origin[1], axis_top[1]],
    color=BLUE, linewidth=1.2, linestyle=(0, (4, 4)),
    alpha=0.65, zorder=1,
)

t = np.linspace(0, 2 * np.pi, 500)
ellipse = orbit(t)
ax.plot(
    ellipse[:, 0], ellipse[:, 1],
    color=SLATE, alpha=0.60, linewidth=1.25,
    linestyle=(0, (4, 4)), zorder=2,
)

def vector_arrow(endpoint, color, width=2.2, zorder=4):
    arrow = FancyArrowPatch(
        origin, endpoint,
        arrowstyle="-|&gt;", mutation_scale=15,
        linewidth=width, color=color,
        shrinkA=0, shrinkB=0, zorder=zorder,
    )
    ax.add_patch(arrow)

vector_arrow(project(u), BLUE, zorder=5)
vector_arrow(project(v), TEAL)
vector_arrow(project(Rv), TERRACOTTA)

# Positive right-handed rotation about +u, from v to Rv.
arc_t = np.linspace(phi, phi + theta, 160)
arc = orbit(arc_t)
ax.plot(
    arc[:, 0], arc[:, 1],
    color=SLATE, linewidth=1.8, solid_capstyle="round", zorder=6,
)
ax.add_patch(FancyArrowPatch(
    arc[-9], arc[-1],
    arrowstyle="-|&gt;", mutation_scale=13,
    color=SLATE, linewidth=1.8,
    shrinkA=0, shrinkB=0, zorder=7,
))

ax.plot(*origin, marker="o", markersize=3.3, color=INK, zorder=8)
ax.text(0, -0.065, r"$O$", ha="center", va="top", fontsize=13)

pv, prv = project(v), project(Rv)
ax.text(
    pv[0] + 0.055, pv[1] - 0.005,
    r"$\mathbf{v}$", color=TEAL, ha="left", va="center", fontsize=15,
)
ax.text(
    prv[0] - 0.055, prv[1] - 0.005,
    r"$\mathbf{R}\mathbf{v}$", color=TERRACOTTA,
    ha="right", va="center", fontsize=15,
)
ax.text(
    0.055, project(u)[1] + 0.025,
    r"$\hat{\mathbf{u}}$", color=BLUE, fontsize=15,
    ha="left", va="bottom",
)

midpoint = orbit(phi + theta / 2)
ax.text(
    midpoint[0], midpoint[1] - 0.055,
    r"$\theta$", color=SLATE, fontsize=15,
    ha="center", va="top",
)
ax.text(
    0, 1.245,
    r"$\mathbf{R}\hat{\mathbf{u}}=\hat{\mathbf{u}}"
    r"\quad(\lambda=1)$",
    color=BLUE, fontsize=14, ha="center", va="center",
)

ax.set_xlim(-0.91, 0.91)
ax.set_ylim(-0.14, 1.37)</dc:description>
